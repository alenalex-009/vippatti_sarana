name: Android CI

on:
  push:
    branches: [main, sih-platform]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # Robolectric SDK-36 (Android 16) sandboxes need JDK 21

      # CI builds against the committed .env.example placeholders; the app
      # then honestly reports GNews/FIRMS as "not configured" — no secrets
      # are needed (and never committed) for compile + unit tests.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile (debug) + unit tests (Robolectric/Roborazzi)
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
